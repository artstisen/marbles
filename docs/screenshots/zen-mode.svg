<svg xmlns="http://www.w3.org/2000/svg" width="868" height="572" viewBox="0 0 868 572">
<title>Marbles: Zen mode, only the title and the text</title>
<style>text{font-family:"Cascadia Mono","Cascadia Code",Consolas,"DejaVu Sans Mono",Menlo,monospace;font-size:14px;white-space:pre}</style>
<rect width="100%" height="100%" rx="10" fill="#0C0C0C"/>
<rect width="100%" height="34" rx="10" fill="#2B2B2B"/>
<rect y="24" width="100%" height="10" fill="#2B2B2B"/>
<circle cx="20" cy="17" r="6" fill="#FF5F57"/>
<circle cx="40" cy="17" r="6" fill="#FEBC2E"/>
<circle cx="60" cy="17" r="6" fill="#28C840"/>
<text x="434.0" y="22" fill="#A0A0A0" text-anchor="middle">Marbles: Zen mode, only the title and the text</text>
<rect x="14.0" y="48" width="25.2" height="17" fill="#16C60C"/>
<rect x="39.2" y="48" width="814.8" height="17" fill="#0037DA"/>
<text x="14.0" y="60.8" fill="#3B78FF" textLength="25.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">[N]</text>
<text x="39.2" y="60.8" fill="#CCCCCC" textLength="117.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Trip to Lisbon</text>
<rect x="14.0" y="65" width="840.0" height="17" fill="#0037DA"/>
<text x="14.0" y="77.8" fill="#F9F1A5" textLength="134.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve"># Trip to Lisbon</text>
<rect x="14.0" y="82" width="840.0" height="17" fill="#0037DA"/>
<rect x="14.0" y="99" width="840.0" height="17" fill="#0037DA"/>
<text x="14.0" y="111.8" fill="#CCCCCC" textLength="571.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Four days in May. Fly out on Thursday morning, back on Monday night.</text>
<rect x="14.0" y="116" width="840.0" height="17" fill="#0037DA"/>
<rect x="14.0" y="133" width="840.0" height="17" fill="#0037DA"/>
<text x="14.0" y="145.8" fill="#16C60C" textLength="75.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">## Places</text>
<rect x="14.0" y="150" width="840.0" height="17" fill="#0037DA"/>
<rect x="14.0" y="167" width="840.0" height="17" fill="#0037DA"/>
<text x="14.0" y="179.8" fill="#61D6D6" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">-</text>
<text x="22.4" y="179.8" fill="#CCCCCC" textLength="462.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> Alfama: walk up to the castle early, before the crowds</text>
<rect x="14.0" y="184" width="840.0" height="17" fill="#0037DA"/>
<text x="14.0" y="196.8" fill="#61D6D6" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">-</text>
<text x="22.4" y="196.8" fill="#CCCCCC" textLength="369.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> Tram 28 from Martim Moniz, sit on the right</text>
<rect x="14.0" y="201" width="840.0" height="17" fill="#0037DA"/>
<text x="14.0" y="213.8" fill="#61D6D6" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">-</text>
<text x="22.4" y="213.8" fill="#CCCCCC" textLength="302.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> LX Factory on Sunday for the market</text>
<rect x="14.0" y="218" width="840.0" height="17" fill="#0037DA"/>
<text x="14.0" y="230.8" fill="#61D6D6" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">-</text>
<text x="22.4" y="230.8" fill="#CCCCCC" textLength="411.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> Belem: the tower, and pastries at the old bakery</text>
<rect x="14.0" y="235" width="840.0" height="17" fill="#0037DA"/>
<rect x="14.0" y="252" width="25.2" height="17" fill="#0037DA"/>
<rect x="39.2" y="252" width="8.4" height="17" fill="#CCCCCC"/>
<rect x="47.6" y="252" width="50.4" height="17" fill="#F9F1A5"/>
<rect x="98.0" y="252" width="756.0" height="17" fill="#0037DA"/>
<text x="14.0" y="264.8" fill="#16C60C" textLength="16.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">##</text>
<text x="39.2" y="264.8" fill="#0C0C0C" textLength="58.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Packing</text>
<rect x="14.0" y="269" width="840.0" height="17" fill="#0037DA"/>
<rect x="14.0" y="286" width="840.0" height="17" fill="#0037DA"/>
<text x="14.0" y="298.8" fill="#61D6D6" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">-</text>
<text x="30.8" y="298.8" fill="#61D6D6" textLength="25.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">[x]</text>
<text x="56.0" y="298.8" fill="#CCCCCC" textLength="277.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> Passport and the boarding passes</text>
<rect x="14.0" y="303" width="840.0" height="17" fill="#0037DA"/>
<text x="14.0" y="315.8" fill="#61D6D6" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">-</text>
<text x="30.8" y="315.8" fill="#61D6D6" textLength="25.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">[x]</text>
<text x="56.0" y="315.8" fill="#CCCCCC" textLength="277.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> Rain jacket (it can turn in May)</text>
<rect x="14.0" y="320" width="840.0" height="17" fill="#0037DA"/>
<text x="14.0" y="332.8" fill="#61D6D6" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">-</text>
<text x="30.8" y="332.8" fill="#61D6D6" textLength="25.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">[ ]</text>
<text x="56.0" y="332.8" fill="#CCCCCC" textLength="260.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> Charger and the travel adapter</text>
<rect x="14.0" y="337" width="840.0" height="17" fill="#0037DA"/>
<text x="14.0" y="349.8" fill="#61D6D6" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">-</text>
<text x="30.8" y="349.8" fill="#61D6D6" textLength="25.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">[ ]</text>
<text x="56.0" y="349.8" fill="#CCCCCC" textLength="235.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> Walking shoes, the old ones</text>
<rect x="14.0" y="354" width="840.0" height="17" fill="#0037DA"/>
<rect x="14.0" y="371" width="840.0" height="17" fill="#0037DA"/>
<text x="14.0" y="383.8" fill="#CCCCCC" textLength="445.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">&gt; Lisbon is a city of hills: plan the walks downhill.</text>
<rect x="14.0" y="388" width="840.0" height="17" fill="#0037DA"/>
<rect x="14.0" y="405" width="840.0" height="17" fill="#0037DA"/>
<text x="14.0" y="417.8" fill="#16C60C" textLength="75.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">## Budget</text>
<rect x="14.0" y="422" width="840.0" height="17" fill="#0037DA"/>
<rect x="14.0" y="439" width="840.0" height="17" fill="#0037DA"/>
<text x="14.0" y="451.8" fill="#CCCCCC" textLength="168.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">| Item      | Cost |</text>
<rect x="14.0" y="456" width="840.0" height="17" fill="#0037DA"/>
<text x="14.0" y="468.8" fill="#CCCCCC" textLength="168.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">|-----------|-----:|</text>
<rect x="14.0" y="473" width="840.0" height="17" fill="#0037DA"/>
<text x="14.0" y="485.8" fill="#CCCCCC" textLength="168.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">| Flights   |  310 |</text>
<rect x="14.0" y="490" width="840.0" height="17" fill="#0037DA"/>
<text x="14.0" y="502.8" fill="#CCCCCC" textLength="168.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">| Hotel     |  420 |</text>
<rect x="14.0" y="507" width="840.0" height="17" fill="#0037DA"/>
<text x="14.0" y="519.8" fill="#CCCCCC" textLength="168.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">| Food      |  200 |</text>
<rect x="14.0" y="524" width="840.0" height="17" fill="#0037DA"/>
<text x="408.8" y="536.8" fill="#F9F1A5" textLength="33.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">12:4</text>
<text x="786.8" y="536.8" fill="#F9F1A5" textLength="42.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">[1/1]</text>
<rect x="14.0" y="541" width="840.0" height="17" fill="#0037DA"/>
