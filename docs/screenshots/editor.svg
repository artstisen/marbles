<text x="14.0" y="94.8" fill="#E74856" textLength="134.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve"># Trip to Lisbon</text>
<text x="14.0" y="128.8" fill="#CCCCCC" textLength="571.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Four days in May. Fly out on Thursday morning, back on Monday night.</text>
<text x="14.0" y="162.8" fill="#B4009E" textLength="75.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">## Places</text>
