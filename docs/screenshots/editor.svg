<text x="56.0" y="315.8" fill="#CCCCCC" textLength="277.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> Passport and the boarding passes</text>
<text x="14.0" y="332.8" fill="#61D6D6" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">-</text>
<text x="30.8" y="332.8" fill="#61D6D6" textLength="25.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">[x]</text>
<text x="56.0" y="332.8" fill="#CCCCCC" textLength="277.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> Rain jacket (it can turn in May)</text>
<text x="14.0" y="349.8" fill="#61D6D6" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">-</text>
