<text x="22.4" y="196.8" fill="#CCCCCC" textLength="67.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> Alfama:</text>
<text x="98.0" y="196.8" fill="#0C0C0C" textLength="33.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">walk</text>
<text x="131.6" y="196.8" fill="#CCCCCC" textLength="352.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> up to the castle early, before the crowds</text>
<text x="14.0" y="213.8" fill="#61D6D6" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">-</text>
<text x="22.4" y="213.8" fill="#CCCCCC" textLength="369.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> Tram 28 from Martim Moniz, sit on the right</text>
<text x="14.0" y="230.8" fill="#61D6D6" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">-</text>
<text x="22.4" y="230.8" fill="#CCCCCC" textLength="302.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> LX Factory on Sunday for the market</text>
<text x="14.0" y="247.8" fill="#61D6D6" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">-</text>
<text x="22.4" y="247.8" fill="#CCCCCC" textLength="411.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> Belem: the tower, and pastries at the old bakery</text>
<text x="14.0" y="281.8" fill="#B4009E" textLength="84.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">## Packing</text>
